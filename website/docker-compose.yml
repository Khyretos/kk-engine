# engine.kreative-kompas.com: the showcase and the docs in one container.
#
#   cd website && docker compose up -d --build     # http://localhost:8080
#
# Put your reverse proxy (Caddy, Traefik, nginx) in front of port 8080 for
# the domain and HTTPS. Rebuild after pulling to publish changes.
services:
  website:
    build:
      context: ..
      dockerfile: website/Dockerfile
      args:
        SITE_URL: https://engine.kreative-kompas.com/
    image: kke-website
    container_name: kke-website
    ports:
      - "8080:8080"
    restart: unless-stopped
    # If the reverse proxy runs in Docker too (Nginx Proxy Manager, Traefik,
    # Caddy in a container), it cannot reach "localhost:8080": that is its own
    # container. Put both on one network and point it at http://kke-website:8080
    # (the container listens on 8080, not 80). Uncomment and set the network
    # name (`docker network ls`), or run `docker network connect NET kke-website`.
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: proxy
