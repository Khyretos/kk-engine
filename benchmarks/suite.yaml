# What kke_benchmark runs (docs/BENCHMARKS.md "Benchmark for everyone").
# Copied next to the executables as benchmark_suite.yaml; a
# benchmark_suite.json there works the same (kke/DataFile.h).
#
# Every demo starts with KKE_BENCHMARK set, plays by itself (the env
# switches below are each demo's own autopilot or bot mode), is measured
# for `seconds` after `warmup`, writes its report and quits.
#
#   id       report and log name
#   exe      executable next to kke_benchmark (".exe" added on Windows)
#   title    what the results call it
#   seconds  measured time (default: defaults.seconds)
#   warmup   unmeasured start (default: defaults.warmup)
#   env      extra environment variables for this demo
#   synty    true when the demo looks its best with Synty packs: without
#            them it runs on stand-in art (blocks), which the results say
#   quick    false = left out of a --quick run

defaults:
  seconds: 20
  warmup: 3
  # Longest a demo may take to load and start measuring before it counts
  # as hung (a slow disk, a software GPU).
  load_timeout: 120

demos:
  - id: showcase_walk
    exe: kke_demo
    title: "Showcase: the course by autopilot"
    env: { KKE_DEMO_AUTOPILOT: "1" }

  - id: showcase_stress
    exe: kke_demo
    title: "Showcase: stress test (300 crates, impacts)"
    # The stress test runs 36 s and ends the game itself.
    seconds: 40
    warmup: 2
    env: { KKE_STRESS_TEST: "1" }

  - id: physics_demo
    exe: physics_demo
    title: "Physics: rigid bodies and soft bodies"

  - id: melt_demo
    exe: melt_demo
    title: "Melt: particle fluid"

  - id: jiggle_demo
    exe: jiggle_demo
    title: "Jiggle: soft-body characters on tour"
    env: { KKE_JIGGLE_MOVE: "4" }

  - id: sea_demo
    exe: sea_demo
    title: "Sea: ocean and floating bodies"

  - id: audio_demo
    exe: audio_demo
    title: "Audio: spatial sound tour"
    env: { KKE_AUDIO_DEMO_TOUR: "1" }

  - id: rmlui_demo
    exe: rmlui_demo
    title: "UI: RmlUi menus"
    quick: false

  - id: imgui_demo
    exe: imgui_demo
    title: "UI: Dear ImGui panels"
    quick: false

  - id: sandbox
    exe: sandbox
    title: "Sandbox: play mode"
    synty: true
    env: { KKE_SANDBOX_MODE: "play" }

  - id: synty_demo
    exe: synty_demo
    title: "Synty scene"
    synty: true
    quick: false

  - id: climb_race
    exe: climb_race
    title: "Climb Race: a race with 3 CPU climbers"
    env: { KKE_CLIMB_AUTOPILOT: "1", KKE_CLIMB_CPUS: "3" }

  - id: flying_pileup
    exe: flying_demo
    title: "Flying: six planes head-on at full speed, every 7 s"
    # Every plane flies into the others over the dogfight town and
    # explodes: fireballs, smoke, sparks, pieces and dents all at once.
    seconds: 30
    synty: true
    env: { KKE_FLY_AUTOPILOT: "1", KKE_FLY_MODE: "dogfight", KKE_FLY_CPUS: "5", KKE_FLY_BENCH: "pileup" }

  - id: procedural_demo
    exe: procedural_demo
    title: "Procedural animation: gaits, look-at, a ragdoll hit"
    env: { KKE_PROC_HIT: "10" }

  - id: cloth_stress
    exe: cloth_demo
    title: "Cloth: many sheets falling over balls"
    env: { KKE_CLOTH_SCENE: "stress", KKE_CLOTH_TOUR: "0" }

  - id: cloth_hair
    exe: cloth_demo
    title: "Hair: strands in the wind"
    env: { KKE_CLOTH_SCENE: "hair", KKE_CLOTH_TOUR: "0" }

  - id: cloth_tour
    exe: cloth_demo
    title: "Cloth and hair: all six scenes (14 s each)"
    # The demo tours its scenes by itself under the benchmark, 14 s per
    # scene from start-up; 84 s measured covers all six.
    seconds: 84
    warmup: 2
    quick: false

  - id: farm_demo
    exe: farm_demo
    title: "Farm: AI animals, farmer on autopilot"
    synty: true
    env: { KKE_FARM_AUTOPILOT: "1" }

  - id: pet_companion
    exe: pet_companion
    title: "Pet companion: orders demo"
    synty: true
    env: { KKE_PET_DEMO: "1" }

  - id: platoon
    exe: platoon
    title: "Platoon: squad orders demo"
    synty: true
    env: { KKE_PLATOON_DEMO: "1" }

  - id: duel
    exe: duel
    title: "Duel: two bots fighting"
    env: { KKE_DUEL_BOTS: "1" }

  - id: goblin_horde
    exe: goblin_horde
    title: "Goblin horde: crowd AI and ragdolls, bot hero"
    synty: true
    env: { KKE_HORDE_BOT: "1" }

  - id: racing_pileup
    exe: racing
    title: "Racing: worst case, 24 cars head-on at 108 km/h"
    # KKE_RACE_BENCH=pileup: the derby pen, brutal damage, every car mended and
    # launched into the middle every 7 s (FEMFX crumpling, blown tyres,
    # lost wheels, debris, smoke and fire all at once).
    synty: true
    env: { KKE_RACE_BENCH: "pileup" }

  - id: tennis_singles
    exe: tennis
    title: "Tennis: busiest case, 100 people, 10 singles matches"
    # KKE_TENNIS_BENCH: a CPU match on every court, 6 spectators each on the
    # benches, the rest walking, a camera flying from court to court
    # (FEMFX: 10 balls and 20 string beds; Jolt: 100 characters).
    seconds: 45
    warmup: 5
    synty: true
    env: { KKE_TENNIS_BENCH: "singles" }

  - id: tennis_doubles
    exe: tennis
    title: "Tennis: busiest case, 100 people, 10 doubles matches"
    # The same with 40 players (40 string beds), 5 spectators a court.
    seconds: 45
    warmup: 5
    synty: true
    env: { KKE_TENNIS_BENCH: "doubles" }

  - id: cookbook
    exe: cookbook
    title: "Cookbook: Lua recipes"
    # A virtual pad walks the character round the level and presses
    # d-pad right (next camera) every few seconds, so the run tours all
    # eight cameras (and plays the camera path) instead of watching an
    # empty field. Not View/Back: that opens the pause menu.
    env:
      KKE_VIRTUAL_INPUT: "pad"
      KKE_VIRTUAL_PAD_SCRIPT: "0.5:lefty=-0.8,0.5:leftx=0.3,2.5:dpad_right,4:a,5:dpad_right,6:leftx=-0.6,7.5:dpad_right,8:rightx=0.5,10:dpad_right,10.5:rightx=0,11:a,12.5:dpad_right,13:leftx=0.6,15:dpad_right,15.5:dpad_up,17.5:dpad_right,18:lefty=0.8,18:leftx=0,20:dpad_right"
    quick: false
