name: Docs site

# Builds https://khyretos.github.io/kk-engine/ from docs/ (docs/DOCS_SITE.md)
# and publishes it with GitHub Pages on every push to main. Pull requests
# only build it, so a broken link fails the PR instead of the site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer PR push cancels the older build; deployments from main always
# finish (Pages' own advice: a cancelled deploy can leave it half-published).
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Material's notice about MkDocs 2.0; the build is pinned below 2.0 in
  # tools/docs_site/requirements.txt, which is what the notice asks for.
  NO_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs_site/requirements.txt
      - name: Install MkDocs
        run: pip install -r tools/docs_site/requirements.txt
      # --strict: any warning (a broken link, a page missing from the
      # menu's targets) fails the build.
      - name: Build the site
        run: mkdocs build --strict
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
