# Downloadable builds (docs/RELEASES.md, issue #14).
#
# Pushing a tag like v0.1.0-alpha builds Linux, Windows and Android packages of the
# engine's demos, tests them, and publishes them as a GitHub Release (a
# pre-release when the tag has a '-' in it). Running the workflow by hand
# (Actions tab -> "Release" -> Run workflow) builds and tests the same
# packages and keeps them as run artifacts; tick "draft" to also put them
# in a draft release that only maintainers can see, or "publish" to release
# them for real (GitHub then creates the version's tag on that commit).
#
# Both platforms build on Linux: Windows is cross-compiled with MinGW-w64
# (same toolchain as docker/windows.Dockerfile; the C++ runtime is linked
# statically, so no MinGW DLLs ship),
# then its unit tests run on a real Windows runner. Paid art packs are
# never part of a package: tools/packaging/package.sh refuses to package
# one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name for the archives (e.g. v0.1.0-alpha)
        required: true
        default: dev
      draft:
        description: Also create a draft GitHub Release
        type: boolean
        default: false
      publish:
        description: Publish the release now (creates the version's tag on this commit)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build glslang-tools spirv-tools \
            libvulkan-dev mesa-vulkan-drivers \
            libfreetype-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev \
            pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libdecor-0-dev libexpat1-dev libxml2-dev \
            xvfb zip

      # libstdc++/libgcc linked statically: the package then needs only
      # glibc, FreeType and the system's Vulkan loader/driver.
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKKE_ENABLE_FEMFX=ON -DKKE_WARNINGS_AS_ERRORS=ON -DKKE_ENABLE_VALIDATION=OFF "-DKKE_VERSION_NAME=$VERSION" \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j 2>&1 | tee build.log

      - name: No warnings anywhere
        run: tools/ci/check_warnings.sh configure.log build.log

      - name: Unit tests
        run: ./build/bin/kke_tests --gtest_brief=1

      - name: Package
        run: tools/packaging/package.sh --bin build/bin --platform linux --version "$VERSION" --out dist --deps build/_deps --strip strip

      # The packaged demos, unpacked somewhere else and started from an
      # unrelated folder: proves the package is complete and that games
      # find their shaders next to the executable, not in the cwd.
      - name: Smoke-test the package
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "dist/kk-engine-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          pkg="$RUNNER_TEMP/unpacked/kk-engine-$VERSION-linux-x86_64"
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          cd "$RUNNER_TEMP"
          failed=0
          for demo in kke_demo physics_demo melt_demo jiggle_demo sea_demo imgui_demo rmlui_demo sandbox synty_demo audio_demo; do
            [ -x "$pkg/$demo" ] || { echo "== $demo: missing from the package"; failed=1; continue; }
            set +e
            DISPLAY=:99 SDL_VIDEODRIVER=x11 KKE_SKIP_INTRO=1 timeout 8 "$pkg/$demo" > "run_$demo.log" 2>&1
            code=$?
            set -e
            if { [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; } || grep -qi "Fatal error" "run_$demo.log"; then
              echo "== $demo: FAILED (exit $code)"; tail -40 "run_$demo.log"; failed=1
            else
              echo "== $demo: ok"
            fi
          done
          # The benchmark people are sent: two short demos, one results file.
          set +e
          DISPLAY=:99 SDL_VIDEODRIVER=x11 KKE_AUDIO=off timeout 180 "$pkg/benchmark/kke_benchmark" --only sea_demo,showcase_walk --seconds 3 \
            --no-wait --no-open --out "$RUNNER_TEMP/bench" > run_kke_benchmark.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] || ! ls "$RUNNER_TEMP"/bench/kke-benchmark-*.json > /dev/null 2>&1; then
            echo "== kke_benchmark: FAILED (exit $code)"; tail -60 run_kke_benchmark.log; failed=1
          else
            echo "== kke_benchmark: ok"
          fi
          exit $failed

      - uses: actions/upload-artifact@v6
        with:
          name: kk-engine-linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    outputs:
      source_dir: ${{ steps.src.outputs.dir }}
    steps:
      - uses: actions/checkout@v5

      # Tests read data files from the source tree by the absolute path
      # they were compiled with (KKE_SOURCE_DIR); windows-test recreates it.
      - id: src
        run: echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Install MinGW-w64 and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build glslang-tools mingw-w64 g++-mingw-w64-x86-64-posix zip

      - name: Configure (MinGW-w64 cross)
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKKE_ENABLE_FEMFX=ON -DKKE_WARNINGS_AS_ERRORS=ON -DKKE_ENABLE_VALIDATION=OFF "-DKKE_VERSION_NAME=$VERSION" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j 2>&1 | tee build.log

      - name: No warnings anywhere
        run: tools/ci/check_warnings.sh configure.log build.log

      - name: Package
        run: tools/packaging/package.sh --bin build/bin --platform windows --version "$VERSION" --out dist --deps build/_deps --strip x86_64-w64-mingw32-strip

      - uses: actions/upload-artifact@v6
        with:
          name: kk-engine-windows
          path: dist/*
          if-no-files-found: error

      # The test binary is not part of the package; the next job runs it
      # on real Windows.
      - uses: actions/upload-artifact@v6
        with:
          name: kke-tests-windows
          path: build/bin/kke_tests.exe
          if-no-files-found: error

  windows-test:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Some tests read files from the source tree (shaders, scenes, fonts)
      # at the Linux build machine's absolute path, which Windows resolves
      # on the current drive: link that path to this checkout.
      - name: Source tree at the build machine's path
        shell: pwsh
        env:
          SOURCE_DIR: ${{ needs.windows.outputs.source_dir }}
        run: |
          $drive = Split-Path -Qualifier $PWD
          $link = Join-Path $drive ($env:SOURCE_DIR -replace '/', '\')
          New-Item -ItemType Directory -Force -Path (Split-Path $link) | Out-Null
          New-Item -ItemType Junction -Path $link -Target $env:GITHUB_WORKSPACE | Out-Null
          if (-not (Test-Path (Join-Path $link 'shaders'))) { throw "source tree not reachable at $link" }
          Write-Output "source tree linked at $link"
      - uses: actions/download-artifact@v7
        with:
          name: kke-tests-windows
      - uses: actions/download-artifact@v7
        with:
          name: kk-engine-windows
      # The tests run inside the unpacked package: that is where the DLLs
      # they share with the demos (librmlui, libspdlog) are.
      - name: Unpack and check the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem kk-engine-*-windows-x86_64.zip
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $dir = (Get-ChildItem unpacked | Select-Object -First 1).FullName
          foreach ($f in 'kke_demo.exe', 'shaders', 'assets', 'README.txt', 'LICENSE.txt', 'THIRD_PARTY_LICENSES.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is missing from $($zip.Name)" }
          }
          Copy-Item kke_tests.exe $dir
          "PKG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "$($zip.Name): complete"
      # No Vulkan driver on the runner, so the demo can't start: this
      # checks the launcher itself on Windows (starting a process, reading
      # its log, writing the results file even when a demo fails).
      - name: Benchmark launcher on Windows
        timeout-minutes: 5
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:PKG_DIR 'benchmark')
          .\kke_benchmark.exe --only sea_demo --seconds 2 --no-wait --no-open --out bench
          Write-Output "kke_benchmark exit code $LASTEXITCODE (3 = a demo could not run, expected without a GPU)"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3) { throw "kke_benchmark failed with exit code $LASTEXITCODE" }
          $results = Get-ChildItem bench\kke-benchmark-*.json
          if (-not $results) { throw "kke_benchmark wrote no results file" }
          Get-Content ($results[0].FullName -replace '\.json$', '.txt')
          $global:LASTEXITCODE = 0
      - name: Unit tests on Windows
        timeout-minutes: 10  # a hang must fail the run, not hold it for 6 hours
        shell: pwsh
        run: |
          Set-Location $env:PKG_DIR
          .\kke_tests.exe --gtest_brief=1
          if ($LASTEXITCODE -ne 0) { throw "kke_tests failed with exit code $LASTEXITCODE" }

  # The demos APK and the benchmark APK for Android phones
  # (docs/ANDROID.md), signed with the
  # project key when the repository has it (ANDROID_KEYSTORE_* secrets).
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Android NDK r28c and SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build python3-yaml

      - name: Configure
        run: |
          set -o pipefail
          cmake --preset android-arm64 -DKKE_WARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-android-arm64 -j 2>&1 | tee build.log

      - name: APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KKE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ks=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kke.keystore"
            ks=(--keystore "$RUNNER_TEMP/kke.keystore")
          fi
          apk="dist/kk-engine-$VERSION-android-arm64.apk"
          bench="dist/kk-engine-benchmark-$VERSION-android-arm64.apk"
          python3 android/build_apk.py --build build-android-arm64 --out "$apk" --version-name "$VERSION" "${ks[@]}" 2>&1 | tee apk.log
          python3 android/build_apk.py --build build-android-arm64 --benchmark --out "$bench" --version-name "$VERSION" "${ks[@]}" 2>&1 | tee -a apk.log
          (cd dist && for f in *.apk; do sha256sum "$f" > "$f.sha256"; done)

      - name: No warnings anywhere
        run: tools/ci/check_warnings.sh configure.log build.log apk.log

      - uses: actions/upload-artifact@v6
        with:
          name: kk-engine-android
          path: dist/*
          if-no-files-found: error

  release:
    needs: [linux, windows-test, android]
    if: github.event_name == 'push' || inputs.draft || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: kk-engine-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IS_TAG: ${{ github.event_name == 'push' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          ls -l dist
          flags=()
          if [ "$IS_TAG" = true ]; then
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          elif [ "$PUBLISH" = true ]; then
            # GitHub creates the tag on this commit as it publishes.
            [[ "$VERSION" =~ ^v[0-9] ]] || { echo "::error::publish needs a version like v0.1.0-alpha, got '$VERSION'"; exit 1; }
            flags+=(--target "$SHA")
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          else
            flags+=(--draft --target "$SHA")
          fi
          gh release create "$VERSION" dist/* --repo "$REPO" --title "Kreative Kompas Engine $VERSION" \
            --notes "Downloadable builds of the engine's demos for Windows and Linux (x86_64, AVX2, Vulkan 1.3). Unpack the archive and run kke_demo, or benchmark/kke_benchmark to measure how well every demo runs on your PC. See README.txt inside the archive and docs/RELEASES.md. Android (arm64, Android 9+, Vulkan): install the .apk on the phone (docs/ANDROID.md)." \
            "${flags[@]}"
