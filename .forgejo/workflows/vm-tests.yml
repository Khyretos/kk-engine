# Windows and Android in virtual machines on soucouyant (docs/VM_TESTS.md).
#
# The Windows build runs in a real Windows 11 (QEMU/KVM, the free evaluation
# image) and the Android build in the Android emulator, instead of only Wine
# and a compile. Each job builds the platform's package, boots the VM, runs
# the unit tests (Windows) and every demo through kke_benchmark or the
# benchmark app, and keeps a summary, screenshots and logs as the run's
# artifact. Vulkan in both VMs is Mesa's lavapipe on the CPU, as in the
# Linux CI: the VMs prove the games start, play and quit on that platform;
# their frame rates aren't a real GPU's.
#
# Runs on Sundays and by hand: a full run takes a few hours of the one
# runner. The VMs' files live on soucouyant in $KKE_VM_DIR, which the job
# container gets as a volume, with /dev/kvm (the runner's config.yml must
# allow both: docs/VM_TESTS.md "Setting up soucouyant"). The Windows image
# is made the first time and remade when its 90-day evaluation nears its
# end, from the ISO in $KKE_VM_DIR/iso.
name: VM tests

on:
  # Sundays at 05:00 Amsterdam time (03:00 UTC in summer), after the nightly
  # CI and benchmark runs have had the runner.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      platforms:
        description: Which VMs (windows, android, or both)
        default: windows,android
      quick:
        description: Quick benchmark run (fewer demos, 8 s each)
        type: boolean
        default: false
      rebuild_windows:
        description: Reinstall the Windows image first
        type: boolean
        default: false

concurrency:
  group: vm-tests
  cancel-in-progress: false

env:
  # Dependencies come from pull mirrors on this Forgejo (khyretos/mirror-<name>,
  # following GitHub every 8 hours): the runners' clones from GitHub kept
  # failing ("the remote end hung up", 2026-10-17). Git's environment
  # config, so nothing is written to any machine's git settings.
  GIT_CONFIG_COUNT: 26
  GIT_CONFIG_KEY_0: url.https://git.kreative-kompas.com/khyretos/mirror-genann.git.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/codeplea/genann.git
  GIT_CONFIG_KEY_1: url.https://git.kreative-kompas.com/khyretos/mirror-freetype.git.insteadOf
  GIT_CONFIG_VALUE_1: https://github.com/freetype/freetype.git
  GIT_CONFIG_KEY_2: url.https://git.kreative-kompas.com/khyretos/mirror-spdlog.git.insteadOf
  GIT_CONFIG_VALUE_2: https://github.com/gabime/spdlog.git
  GIT_CONFIG_KEY_3: url.https://git.kreative-kompas.com/khyretos/mirror-googletest.git.insteadOf
  GIT_CONFIG_VALUE_3: https://github.com/google/googletest.git
  GIT_CONFIG_KEY_4: url.https://git.kreative-kompas.com/khyretos/mirror-vulkanmemoryallocator.git.insteadOf
  GIT_CONFIG_VALUE_4: https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git
  GIT_CONFIG_KEY_5: url.https://git.kreative-kompas.com/khyretos/mirror-glm.git.insteadOf
  GIT_CONFIG_VALUE_5: https://github.com/g-truc/glm.git
  GIT_CONFIG_KEY_6: url.https://git.kreative-kompas.com/khyretos/mirror-yaml-cpp.git.insteadOf
  GIT_CONFIG_VALUE_6: https://github.com/jbeder/yaml-cpp.git
  GIT_CONFIG_KEY_7: url.https://git.kreative-kompas.com/khyretos/mirror-joltphysics.git.insteadOf
  GIT_CONFIG_VALUE_7: https://github.com/jrouwe/JoltPhysics.git
  GIT_CONFIG_KEY_8: url.https://git.kreative-kompas.com/khyretos/mirror-vulkan-headers.git.insteadOf
  GIT_CONFIG_VALUE_8: https://github.com/KhronosGroup/Vulkan-Headers.git
  GIT_CONFIG_KEY_9: url.https://git.kreative-kompas.com/khyretos/mirror-sdl.git.insteadOf
  GIT_CONFIG_VALUE_9: https://github.com/libsdl-org/SDL.git
  GIT_CONFIG_KEY_10: url.https://git.kreative-kompas.com/khyretos/mirror-monocypher.git.insteadOf
  GIT_CONFIG_VALUE_10: https://github.com/LoupVaillant/Monocypher.git
  GIT_CONFIG_KEY_11: url.https://git.kreative-kompas.com/khyretos/mirror-enet.git.insteadOf
  GIT_CONFIG_VALUE_11: https://github.com/lsalzman/enet.git
  GIT_CONFIG_KEY_12: url.https://git.kreative-kompas.com/khyretos/mirror-miniaudio.git.insteadOf
  GIT_CONFIG_VALUE_12: https://github.com/mackron/miniaudio.git
  GIT_CONFIG_KEY_13: url.https://git.kreative-kompas.com/khyretos/mirror-rmlui.git.insteadOf
  GIT_CONFIG_VALUE_13: https://github.com/mikke89/RmlUi.git
  GIT_CONFIG_KEY_14: url.https://git.kreative-kompas.com/khyretos/mirror-json.git.insteadOf
  GIT_CONFIG_VALUE_14: https://github.com/nlohmann/json.git
  GIT_CONFIG_KEY_15: url.https://git.kreative-kompas.com/khyretos/mirror-stb.git.insteadOf
  GIT_CONFIG_VALUE_15: https://github.com/nothings/stb.git
  GIT_CONFIG_KEY_16: url.https://git.kreative-kompas.com/khyretos/mirror-imgui.git.insteadOf
  GIT_CONFIG_VALUE_16: https://github.com/ocornut/imgui.git
  GIT_CONFIG_KEY_17: url.https://git.kreative-kompas.com/khyretos/mirror-recastnavigation.git.insteadOf
  GIT_CONFIG_VALUE_17: https://github.com/recastnavigation/recastnavigation.git
  GIT_CONFIG_KEY_18: url.https://git.kreative-kompas.com/khyretos/mirror-hiredis.git.insteadOf
  GIT_CONFIG_VALUE_18: https://github.com/redis/hiredis.git
  GIT_CONFIG_KEY_19: url.https://git.kreative-kompas.com/khyretos/mirror-ufbx.git.insteadOf
  GIT_CONFIG_VALUE_19: https://github.com/ufbx/ufbx.git
  GIT_CONFIG_KEY_20: url.https://git.kreative-kompas.com/khyretos/mirror-opus.git.insteadOf
  GIT_CONFIG_VALUE_20: https://github.com/xiph/opus.git
  GIT_CONFIG_KEY_21: url.https://git.kreative-kompas.com/khyretos/mirror-rnnoise.git.insteadOf
  GIT_CONFIG_VALUE_21: https://github.com/xiph/rnnoise.git
  GIT_CONFIG_KEY_22: url.https://git.kreative-kompas.com/khyretos/mirror-speexdsp.git.insteadOf
  GIT_CONFIG_VALUE_22: https://github.com/xiph/speexdsp.git
  GIT_CONFIG_KEY_23: url.https://git.kreative-kompas.com/khyretos/mirror-meshoptimizer.git.insteadOf
  GIT_CONFIG_VALUE_23: https://github.com/zeux/meshoptimizer.git
  GIT_CONFIG_KEY_24: url.https://git.kreative-kompas.com/khyretos/mirror-volk.git.insteadOf
  GIT_CONFIG_VALUE_24: https://github.com/zeux/volk.git
  GIT_CONFIG_KEY_25: url.https://git.kreative-kompas.com/khyretos/mirror-wayland.git.insteadOf
  GIT_CONFIG_VALUE_25: https://gitlab.freedesktop.org/wayland/wayland.git
  KKE_JOBS: "8"          # soucouyant has 32 GB of RAM; see ci.yml
  KKE_VM_DIR: /srv/kke-vm
  KKE_VM_CPUS: "8"       # of 16 threads; the job's own build is done by then
  KKE_VM_MEM_MB: "8192"
  VERSION: vm-test

jobs:
  windows:
    if: github.event_name == 'schedule' || contains(inputs.platforms, 'windows')
    runs-on: soucouyant
    timeout-minutes: 300
    container:
      image: git.kreative-kompas.com/khyretos/kke-vm:1
      options: --device /dev/kvm --volume /srv/kke-vm:/srv/kke-vm
    steps:
      - uses: actions/checkout@v4

      - name: KVM and the VM tools are there
        run: python3 -W error tools/vm/kke_vm.py check --windows

      # Made once (about 30 minutes), and again before the evaluation ends.
      - name: Windows image
        env:
          REBUILD: ${{ inputs.rebuild_windows && '--force' || '' }}
        run: python3 -W error tools/vm/kke_vm.py windows-prepare --if-needed $REBUILD

      - name: Configure (MinGW-w64 cross)
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKKE_ENABLE_FEMFX=ON -DKKE_WARNINGS_AS_ERRORS=ON -DKKE_ENABLE_VALIDATION=OFF "-DKKE_VERSION_NAME=$VERSION" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j "$KKE_JOBS" 2>&1 | tee build.log

      - name: No warnings anywhere
        run: tools/ci/check_warnings.sh configure.log build.log

      - name: Package
        run: tools/packaging/package.sh --bin build/bin --platform windows --version "$VERSION" --out dist --deps build/_deps --strip x86_64-w64-mingw32-strip

      - name: Tests and demos in Windows 11
        env:
          QUICK: ${{ inputs.quick && '--quick' || '' }}
        run: |
          python3 -W error tools/vm/kke_vm.py windows-test --package dist/kk-engine-$VERSION-windows-x86_64.zip \
            --tests build/bin/kke_tests.exe --source . --out vm-results/windows $QUICK

      - name: Summary
        if: always()
        run: |
          cat vm-results/windows/summary.md 2>/dev/null || echo "No summary, the VM did not get that far (see the step above)."

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: vm-windows
          path: vm-results/windows/

  android:
    if: github.event_name == 'schedule' || contains(inputs.platforms, 'android')
    runs-on: soucouyant
    timeout-minutes: 240
    container:
      image: git.kreative-kompas.com/khyretos/kke-vm:1
      options: --device /dev/kvm --volume /srv/kke-vm:/srv/kke-vm
    steps:
      - uses: actions/checkout@v4

      - name: KVM and the emulator are there
        run: python3 -W error tools/vm/kke_vm.py check --android

      # x86_64 rather than the phones' arm64: the emulator then runs the
      # games natively, with no ARM translation.
      - name: Configure (android-x86_64)
        run: |
          set -o pipefail
          cmake --preset android-x86_64 -DKKE_WARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log

      - name: Build (android-x86_64)
        run: |
          set -o pipefail
          cmake --build build-android-x86_64 -j "$KKE_JOBS" 2>&1 | tee build.log

      - name: APKs
        run: |
          set -o pipefail
          python3 android/build_apk.py --build build-android-x86_64 --out dist/kke-demos-android-x86_64.apk 2>&1 | tee apk.log
          python3 android/build_apk.py --build build-android-x86_64 --benchmark --out dist/kke-benchmark-android-x86_64.apk 2>&1 | tee -a apk.log

      - name: No warnings anywhere
        run: tools/ci/check_warnings.sh configure.log build.log apk.log

      - name: Demos in the Android emulator
        env:
          QUICK: ${{ inputs.quick && '--quick' || '' }}
        run: |
          python3 -W error tools/vm/kke_vm.py android-test --apk dist/kke-demos-android-x86_64.apk \
            --benchmark-apk dist/kke-benchmark-android-x86_64.apk --out vm-results/android $QUICK

      - name: Summary
        if: always()
        run: |
          cat vm-results/android/summary.md 2>/dev/null || echo "No summary, the emulator did not get that far (see the step above)."

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: vm-android
          path: vm-results/android/
