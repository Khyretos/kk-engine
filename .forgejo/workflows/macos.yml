# macOS (Intel) tests on the Mac runner (runner label macos-amd64: a 2018 MacBook Air, macOS 14, MoltenVK).
# soucouyant cross-builds the x86_64 package with osxcross (docker/macos.Dockerfile); the Mac only unpacks it and runs the unit tests
# with tools/ci/macos_test.sh; nothing is built there. The runner is started on demand, so this runs only by hand (no schedule),
# and a dispatch waits in the queue while the Mac is off.
name: macOS

on:
  workflow_dispatch:

concurrency:
  group: macos
  cancel-in-progress: false

env:
  KKE_JOBS: "8"
  VERSION: macos-test

jobs:
  build:
    runs-on: soucouyant
    timeout-minutes: 120
    container:
      image: git.kreative-kompas.com/khyretos/kke-macos:1
    steps:
      - uses: actions/checkout@v4

      - name: Source tree at /tmp/kke-src
        run: |
          # The tests read the source tree at the path they were built from (KKE_SOURCE_DIR).
          # /tmp/kke-src exists on the Mac too, where macos_test.sh unpacks the same tree.
          git archive --format=tar HEAD > src.tar
          mkdir -p /tmp/kke-src
          tar -xf src.tar -C /tmp/kke-src

      - name: Configure (osxcross, x86_64)
        working-directory: /tmp/kke-src
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKKE_ENABLE_FEMFX=ON -DKKE_WARNINGS_AS_ERRORS=ON -DKKE_ENABLE_VALIDATION=OFF "-DKKE_VERSION_NAME=$VERSION" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos-x86_64-osxcross.cmake 2>&1 | tee configure.log

      - name: Build
        working-directory: /tmp/kke-src
        run: |
          set -o pipefail
          cmake --build build -j "$KKE_JOBS" 2>&1 | tee build.log

      - name: No warnings anywhere
        working-directory: /tmp/kke-src
        run: |
          set -o pipefail
          tools/ci/check_warnings.sh configure.log build.log

      - name: Package
        working-directory: /tmp/kke-src
        run: |
          # --strip is omitted as per spec.
          tools/packaging/package.sh --bin build/bin --platform macos --version "$VERSION" --out "$GITHUB_WORKSPACE/dist" --deps build/_deps
          cp build/bin/kke_tests "$GITHUB_WORKSPACE/dist/"
          cp "$GITHUB_WORKSPACE/src.tar" "$GITHUB_WORKSPACE/dist/"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: macos-build
          path: dist/

  test:
    needs: build
    runs-on: macos-amd64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: macos-build
          path: dist

      - name: Unit tests
        run: |
          # Unpack the source tree to /tmp/kke-src (expected by macos_test.sh).
          tar -xf dist/src.tar -C /tmp/
          
          # Run the test script.
          # Arguments: package, kke_tests binary, source tar, runner dir, results dir
          tools/ci/macos_test.sh "dist/kk-engine-$VERSION-macos-x86_64.tar.gz" dist/kke_tests dist/src.tar kke-run results

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: macos-tests
          path: results/
