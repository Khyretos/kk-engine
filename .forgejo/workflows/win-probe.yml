name: win-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows
    steps:
      - name: cmd shell
        shell: cmd
        run: |
          echo hello from cmd
          whoami
          where python py node git tar cmake ninja vulkaninfo
          python --version
          echo USERPROFILE=%USERPROFILE%
          echo VK_DRIVER_FILES=%VK_DRIVER_FILES% VK_ICD_FILENAMES=%VK_ICD_FILENAMES%
          reg query HKLM\SOFTWARE\Khronos\Vulkan\Drivers
          mkdir C:\workspace\probe && echo C:\workspace writable && rmdir C:\workspace\probe
      - name: powershell -File
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Output "hello from powershell"
          $PSVersionTable.PSVersion.ToString()
          [Environment]::UserInteractive
          (Get-Process -Id $PID).SessionId
          $v = Get-Command vulkaninfo -ErrorAction SilentlyContinue
          if ($v) { & $v.Source --summary 2>&1 | Select-Object -First 40 } else { "no vulkaninfo on PATH" }
