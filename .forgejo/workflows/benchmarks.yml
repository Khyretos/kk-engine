name: Benchmarks

# Forgejo port of the former .github/workflows/benchmarks.yml (Forgejo is the
# main repository now; a branch GitHub pushed itself would be overwritten by
# the push mirror). Runs on soucouyant in the CI image (docker/ci.Dockerfile),
# so the numbers come from one fixed machine. Nightly and by hand, like ci.yml:
# main is pushed too often to build every commit here.
#
# The headless benchmark suite (docs/BENCHMARKS.md): kke_bench's CPU cases
# plus the showcase stress test under Xvfb + lavapipe, on a Release build.
#
# Runs on main append the numbers to the history on the
# `benchmark-data` branch (history.jsonl, a README with trend charts);
# runs by hand on another branch do a quick pass and only compare. Either
# way the job log shows each number against the recent median. Nothing here
# fails on a slow number: a busy machine is too noisy for that. It fails when
# a benchmark crashes, doesn't report, or the build has a warning.
on:
  # Nightly at 04:00 Amsterdam time, after ci.yml's run has had the runner.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# One run per ref at a time. On main the history is appended in commit
# order, so a newer push waits instead of cancelling a run mid-write.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KKE_JOBS: "8"   # soucouyant has 32 GB of RAM; see ci.yml

jobs:
  benchmarks:
    runs-on: soucouyant
    container:
      image: git.kreative-kompas.com/khyretos/kke-ci:1
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4


      - name: Configure (Release, warnings are errors)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKKE_WARNINGS_AS_ERRORS=ON -DKKE_ENABLE_TESTS=OFF -DKKE_ENABLE_VALIDATION=OFF

      - name: Build kke_bench and the showcase
        run: cmake --build build -j "$KKE_JOBS" --target kke_bench kke_demo

      - name: kke_bench (headless CPU suite)
        run: |
          mode=""
          [ "${{ github.ref }}" != "refs/heads/main" ] && mode="--quick"
          ./build/bin/kke_bench $mode --out "$PWD/bench-out"

      - name: Stress test (showcase, Xvfb + lavapipe)
        run: |
          # The X server's own keymap chatter (keysyms its xkb data lacks)
          # goes to xvfb.log, uploaded with the reports.
          Xvfb :99 -screen 0 1280x720x24 > "$GITHUB_WORKSPACE/bench-out-xvfb.log" 2>&1 &
          sleep 2
          cd build/bin
          rm -f imgui.ini
          set +e
          DISPLAY=:99 SDL_VIDEODRIVER=x11 KKE_SKIP_INTRO=1 KKE_AUDIO=off KKE_STRESS_TEST=1 KKE_BENCH_DIR="$GITHUB_WORKSPACE/bench-out" \
            timeout 300 ./kke_demo > stress.log 2>&1
          code=$?
          set -e
          tail -5 stress.log
          if [ "$code" -ne 0 ] || grep -qi "Fatal error" stress.log; then
            echo "stress test failed (exit $code)"; tail -60 stress.log; exit 1
          fi
          ls "$GITHUB_WORKSPACE"/bench-out/stress_*.json > /dev/null || { echo "stress test wrote no report"; tail -60 stress.log; exit 1; }

      # The history lives on its own branch so these commits never touch
      # main (seven people and agents push to main; a bot commit per push
      # there would be noise and merge churn).
      - name: Fetch the benchmark history
        run: |
          if git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch --depth=1 \
              "${{ github.server_url }}/${{ github.repository }}" benchmark-data 2>/dev/null; then
            git worktree add history FETCH_HEAD
          else
            mkdir history
          fi

      - name: Compare (other branches)
        if: github.ref != 'refs/heads/main'
        run: |
          python3 benchmarks/track.py --dry-run --history history --commit "${{ github.sha }}" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --ref "${{ github.ref }}" bench-out/*.json | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Record and compare (main)
        if: github.ref == 'refs/heads/main'
        run: |
          python3 benchmarks/track.py --history history --commit "${{ github.sha }}" \
            --date "$(git log -1 --format=%cI)" --ref "${{ github.ref }}" bench-out/*.json | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Push the history to the benchmark-data branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd history
          [ -d .git ] || [ -f .git ] || { git init -q; git checkout -q --orphan benchmark-data; }
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@kreative-kompas.com"
          git add -A
          git commit -q -m "Benchmarks for ${GITHUB_SHA::10}"
          git -c http.extraHeader="Authorization: token ${{ github.token }}" push \
            "${{ github.server_url }}/${{ github.repository }}" HEAD:refs/heads/benchmark-data

      - name: Upload the reports
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            bench-out/
            build/bin/stress.log
            bench-out-xvfb.log
