# Builds https://khyretos.github.io/kk-engine/ from docs/ (docs/DOCS_SITE.md)
# on soucouyant and publishes it on every push to main by pushing the built
# site to this repository's gh-pages branch. Forgejo's push mirror copies
# gh-pages to GitHub, where GitHub Pages serves it. Pull requests only build
# it, so a broken link fails the PR instead of the site.
#
# This replaces .github/workflows/docs.yml: since Forgejo became the main
# repository, anything GitHub pushes itself is overwritten by the mirror.
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels an older PR build; publishes from main queue up
# instead, so each one finishes.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Material's notice about MkDocs 2.0; the build is pinned below 2.0 in
  # tools/docs_site/requirements.txt, which is what the notice asks for.
  NO_MKDOCS_2_WARNING: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  site:
    runs-on: soucouyant
    container:
      image: python:3.12-bookworm
    steps:
      - name: Check out (plain git; this image has no Node for actions/checkout)
        run: |
          git init -q . && git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - name: Install MkDocs
        run: pip install -q -r tools/docs_site/requirements.txt
      # --strict: any warning (a broken link, a missing page) fails the build.
      - name: Build the site
        run: mkdocs build --strict
      # The showcase site (website/, engine.kreative-kompas.com) is built
      # here too, so a broken template fails CI instead of the deploy.
      - name: Build the showcase site
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.134.3/hugo_extended_0.134.3_linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" --source website --minify --panicOnWarning -d "$RUNNER_TEMP/website"
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd site
          touch .nojekyll # serve the files as they are
          git init -q -b gh-pages
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@kreative-kompas.com"
          git add -A
          git commit -q -m "Docs site from ${{ github.sha }}"
          git -c http.extraHeader="Authorization: token ${{ github.token }}" push -q --force "${{ github.server_url }}/${{ github.repository }}" gh-pages
