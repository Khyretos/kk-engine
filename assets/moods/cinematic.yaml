# A film look: the golden hour through a teal-and-orange grade (a colour LUT, assets/luts).
title: Cinematic
description: Warm low sun, teal shadows and orange light, as in the films.
sky:
  image: late_afternoon     # Poly Haven "Qwantani Late Afternoon (Pure Sky)", CC0
  ambientStrength: 0.3
sun:
  azimuth: 140
  intensity: 2.4
fill:
  color: "#8ea7d6"
  intensity: 0.2
fog:
  density: 0.0018
  heightFalloff: 0.05
  maxOpacity: 0.85
  sunScatter: 1.2
lut: teal_orange
exposure: 0.95
ambience: wind_soft
